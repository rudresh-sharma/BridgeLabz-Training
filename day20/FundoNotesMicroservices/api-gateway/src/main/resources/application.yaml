spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET,POST

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET,POST


            - id: notes-service
              uri: lb://NOTES-SERVICE
              predicates:
                - Path=/notes/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET,POST,PUT,PATCH,DELETE


            - id: labels-service
              uri: lb://NOTES-SERVICE
              predicates:
                - Path=/labels/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET,POST,PUT,DELETE


            - id: search-service
              uri: lb://SEARCH-SERVICE
              predicates:
                - Path=/search/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET


            # reminder-service route — uncomment when reminder-service is created
            - id: reminder-service
              uri: lb://REMINDER-SERVICE
              predicates:
                - Path=/reminders/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET


            # batch route — uncomment when batch endpoints are added to notes-service
            # - id: batch-service
            #   uri: lb://NOTES-SERVICE
            #   predicates:
            #     - Path=/batch/**
            #   filters:
            #     - name: Retry
            #       args:
            #         retries: 3
            #         statuses: SERVICE_UNAVAILABLE
            #         methods: GET,POST
    loadbalancer:
      cache:
        enabled: false

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5

  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  tracing:
    sampling:
      probability: 1.0   # 1.0 = trace 100% of requests (dev only; lower in prod, e.g. 0.1)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans