<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | GreetingApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f59e0b, #d97706, #92400e);
            padding: 2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: #fff;
        }
        h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }
        .error-msg {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fecaca;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            margin-top: 1rem;
            opacity: 0.9;
        }
        input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.9);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus {
            border-color: #fff;
        }
        button {
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            background: #1f2937;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #111827;
        }
        .cancel-link {
            display: inline-block;
            margin-top: 1rem;
            color: #fff;
            text-decoration: underline;
            font-size: 0.9rem;
            opacity: 0.85;
        }
        .cancel-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>&#9998; Edit Profile</h2>

    <p class="error-msg" th:if="${errorMessage}" th:text="${errorMessage}"></p>

	<form th:action="@{/user/edit}" th:object="${user}" method="post">
	    <input type="hidden" name="_method" value="PUT">
        <label>Name</label>
        <input type="text" th:field="*{name}" required/>

        <label>Email</label>
        <input type="email" th:field="*{email}" required/>

        <label>New Password</label>
        <input type="password" name="password" required/>

        <button type="submit">Save Changes</button>
    </form>

    <a class="cancel-link" th:href="@{/greeting}">&larr; Cancel</a>
</div>
</body>
</html>
