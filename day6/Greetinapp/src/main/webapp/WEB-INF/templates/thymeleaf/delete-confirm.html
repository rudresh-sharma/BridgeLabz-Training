<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account | GreetingApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7f1d1d, #991b1b, #b91c1c);
            padding: 2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: #fff;
        }
        h2 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
        }
        p {
            opacity: 0.85;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            background: #dc2626;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #b91c1c;
        }
        .cancel-link {
            display: inline-block;
            margin-top: 1rem;
            color: #fff;
            text-decoration: underline;
            font-size: 0.9rem;
            opacity: 0.85;
        }
        .cancel-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>&#128465; Delete Your Account?</h2>
    <p>This action cannot be undone. All your data will be permanently removed.</p>

	<form th:action="@{/user/delete}" method="post">
	    <input type="hidden" name="_method" value="DELETE">
	    <button type="submit">Yes, delete my account</button>
	</form>

    <a class="cancel-link" th:href="@{/greeting}">Cancel</a>
</div>
</body>
</html>
