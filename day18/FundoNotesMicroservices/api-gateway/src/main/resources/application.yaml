spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET,POST

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET,POST


            - id: notes-service
              uri: lb://NOTES-SERVICE
              predicates:
               - Path=/notes/**
              filters:
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET,POST

    loadbalancer:
      cache:
        enabled: false

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5

  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
